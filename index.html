<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>생애 연도별 학업·설계·연애·취업 타임라인 (1995 - 2030)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0d14;
      --bg-secondary: #121722;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(99, 102, 241, 0.4);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --navy-bg: rgba(30, 58, 138, 0.45);
      --navy-border: #3b82f6;
      --army-bg: rgba(45, 90, 39, 0.45);
      --army-border: #22c55e;
      --police-bg: rgba(30, 64, 175, 0.45);
      --police-border: #60a5fa;
      --airforce-bg: rgba(2, 132, 199, 0.45);
      --airforce-border: #38bdf8;
      --leave-bg: rgba(133, 77, 14, 0.4);
      --leave-border: #f59e0b;
      --love-bg: rgba(225, 29, 72, 0.18);
      --love-border: #fb7185;
      --marriage-bg: rgba(244, 63, 94, 0.4);
      --marriage-border: #fda4af;
      --job-bg: rgba(99, 102, 241, 0.28);
      --job-border: #818cf8;
      
      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
    }

    .ambient-glow {
      position: fixed;
      top: -20%; left: 20%; width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, rgba(225, 29, 72, 0.04) 40%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    .app-container {
      position: relative; z-index: 1;
      max-width: 100%;
      padding: 24px 32px 60px 32px;
    }

    header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end;
      gap: 20px; margin-bottom: 24px; padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .title-area h1 {
      font-size: 26px; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .title-area p { font-size: 14px; color: var(--text-muted); }

    .controls-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }

    .search-box { position: relative; min-width: 220px; }
    .search-box input {
      width: 100%; background: var(--bg-secondary);
      border: 1px solid var(--border-color); color: var(--text-main);
      padding: 9px 14px 9px 36px; border-radius: 8px; font-size: 13px;
      outline: none; transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--border-highlight);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    .search-box svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; fill: var(--text-dim);
    }

    .view-tabs {
      display: flex; background: var(--bg-secondary); padding: 4px;
      border-radius: 10px; border: 1px solid var(--border-color); gap: 4px;
    }
    .view-btn {
      background: transparent; border: none; color: var(--text-muted);
      padding: 7px 14px; font-size: 13px; font-weight: 600; border-radius: 6px;
      cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .view-btn.active {
      background: rgba(99, 102, 241, 0.25); color: #ffffff;
      border: 1px solid rgba(99, 102, 241, 0.5);
    }

    .legend-bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
      background: rgba(18, 23, 34, 0.6); backdrop-filter: blur(10px);
      padding: 12px 18px; border-radius: 12px; border: 1px solid var(--border-color);
      margin-bottom: 24px; font-size: 12px;
    }
    .legend-label { font-weight: 700; color: var(--text-muted); margin-right: 4px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; color: var(--text-main); }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; }

    /* Vertical Scrolling Table */
    .vertical-wrapper {
      position: relative; overflow-y: auto; overflow-x: auto;
      background: var(--bg-secondary); border-radius: 14px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      max-height: calc(100vh - 230px);
    }

    .v-table {
      border-collapse: separate; border-spacing: 0; width: 100%;
      text-align: center; font-size: 12px;
    }

    /* Sticky Headers */
    .v-table thead tr:nth-child(1) th {
      position: sticky; top: 0; z-index: 25;
      background: #0f1422; border-bottom: 1px solid var(--border-color);
      padding: 10px 6px; font-weight: 700; color: #cbd5e1;
    }
    .v-table thead tr:nth-child(2) th {
      position: sticky; top: 38px; z-index: 25;
      background: #141b2d; border-bottom: 2px solid rgba(255, 255, 255, 0.2);
      padding: 6px 4px; font-size: 11px; font-weight: 600; color: var(--text-muted);
    }

    /* Sticky Left Columns */
    .v-col-year {
      position: sticky; left: 0; z-index: 10;
      background: #131826; font-weight: 700; width: 64px; min-width: 64px;
      border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);
      color: #e2e8f0; font-family: var(--font-mono);
    }
    .v-col-age {
      position: sticky; left: 64px; z-index: 10;
      background: #161c2c; font-weight: 600; width: 68px; min-width: 68px;
      border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);
      color: var(--text-muted); font-size: 11px;
    }
    .v-col-sem {
      position: sticky; left: 132px; z-index: 10;
      background: #192033; width: 54px; min-width: 54px;
      border-right: 2px solid rgba(255, 255, 255, 0.15); border-bottom: 1px solid var(--border-color);
      color: var(--text-dim); font-size: 11px;
    }

    .v-table thead th.v-corner-1 { position: sticky; left: 0; top: 0; z-index: 40; background: #0c101a; }
    .v-table thead th.v-corner-2 { position: sticky; left: 64px; top: 0; z-index: 40; background: #0c101a; }
    .v-table thead th.v-corner-3 { position: sticky; left: 132px; top: 0; z-index: 40; background: #0c101a; border-right: 2px solid rgba(255, 255, 255, 0.15); }

    .v-table td {
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 6px 8px; vertical-align: middle;
      transition: background 0.15s; font-size: 12px;
    }
    .v-table tbody tr:hover td { background: rgba(255, 255, 255, 0.02); }

    .v-cell-academic { min-width: 130px; max-width: 170px; }
    .v-cell-love { min-width: 95px; max-width: 120px; color: #fb7185; }
    .v-cell-notes { min-width: 220px; text-align: left; font-size: 11px; color: #fcd34d; font-weight: 500; }

    .merged-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 36px;
    }

    /* Badges */
    .badge-navy {
      background: var(--navy-bg); border: 1px solid var(--navy-border);
      color: #fff; font-weight: 700; border-radius: 6px; padding: 6px 4px; width: 100%;
    }
    .badge-army {
      background: var(--army-bg); border: 1px solid var(--army-border);
      color: #fff; font-weight: 700; border-radius: 6px; padding: 6px 4px; width: 100%;
    }
    .badge-police {
      background: var(--police-bg); border: 1px solid var(--police-border);
      color: #fff; font-weight: 700; border-radius: 6px; padding: 6px 4px; width: 100%;
    }
    .badge-airforce {
      background: var(--airforce-bg); border: 1px solid var(--airforce-border);
      color: #fff; font-weight: 700; border-radius: 6px; padding: 6px 4px; width: 100%;
    }
    .badge-leave {
      background: var(--leave-bg); border: 1px solid var(--leave-border);
      color: #fde68a; font-weight: 600; border-radius: 6px; padding: 6px 4px; width: 100%;
    }
    .badge-grad {
      background: rgba(71, 85, 105, 0.3); color: #cbd5e1; font-weight: 600;
      border-radius: 6px; padding: 6px; width: 100%;
    }
    .badge-job {
      background: var(--job-bg); border: 1px solid var(--job-border);
      color: #c7d2fe; font-weight: 700; border-radius: 6px; padding: 6px; width: 100%;
    }
    .badge-studio {
      background: rgba(99, 102, 241, 0.12); border: 1px solid rgba(99, 102, 241, 0.3);
      color: #e0e7ff; border-radius: 6px; padding: 5px 6px; font-weight: 500;
      display: inline-block; width: 100%;
    }
    .badge-studio b { font-weight: 700; color: #fff; }

    .badge-love {
      background: var(--love-bg); border: 1px solid var(--love-border);
      color: #ffe4e6; font-weight: 600; border-radius: 6px; padding: 5px 6px;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      font-size: 11px; width: 100%;
    }
    .badge-marriage {
      background: var(--marriage-bg); border: 2px solid var(--marriage-border);
      color: #fff; font-weight: 800; border-radius: 6px; padding: 6px 8px;
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.4);
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      font-size: 12px; width: 100%;
    }

    /* Cards Grid View (Milestones) */
    .cards-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 20px; margin-top: 10px;
    }
    .overlap-card {
      background: var(--bg-secondary); border: 1px solid var(--border-color);
      border-radius: 14px; padding: 20px; position: relative; overflow: hidden;
    }
    .overlap-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
      background: #f59e0b;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-year { font-size: 16px; font-weight: 800; color: #fbbf24; font-family: var(--font-mono); }
    .card-tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .card-title { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .card-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.6; }
    .card-members { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color); }
    .member-pill { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: rgba(255, 255, 255, 0.06); color: #e2e8f0; }
    .member-pill.highlight { background: rgba(99, 102, 241, 0.25); border: 1px solid rgba(99, 102, 241, 0.4); color: #fff; font-weight: 600; }

    /* Scrubber View */
    .scrubber-container { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 14px; padding: 24px; }
    .active-year-display { font-size: 32px; font-weight: 800; font-family: var(--font-mono); color: #6366f1; }
    .year-slider { width: 100%; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); outline: none; -webkit-appearance: none; cursor: pointer; margin: 16px 0 24px 0; }
    .year-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #6366f1; border: 3px solid #fff; cursor: pointer; }
    .person-snapshots { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
    .snapshot-card { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; }
    .snapshot-name { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .snapshot-status { font-size: 13px; color: #cbd5e1; margin-bottom: 8px; padding: 6px 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.25); }
    .snapshot-love { font-size: 12px; color: #fb7185; background: rgba(225, 29, 72, 0.12); padding: 4px 8px; border-radius: 6px; display: inline-block; }

    footer { margin-top: 40px; text-align: center; font-size: 12px; color: var(--text-dim); }
  </style>
</head>

  <div class="ambient-glow"></div>

  <div class="app-container">

          <button class="view-btn" onclick="switchView('overlaps')">
            <span>✨</span> 겹침 마일스톤

    <div class="legend-bar">

      <span class="legend-item"><span class="legend-dot" style="background:#fda4af;"></span> 💍 결혼</span>
      <span class="legend-item"><span class="legend-dot" style="background:#f59e0b;"></span> ★ 동일 스튜디오/동기</span>
    </div>

    <!-- VIEW 1: VERTICAL SCROLLING TABLE WITH CELL MERGING -->
    <div id="viewVertical" class="vertical-wrapper">
      <table class="v-table" id="vTable"></table>
    </div>

    <!-- VIEW 2: OVERLAPS VIEW -->
    <div id="viewOverlaps" class="cards-grid" style="display:none;"></div>

    <!-- VIEW 3: SCRUBBER VIEW -->
    <div id="viewScrubber" class="scrubber-container" style="display:none;">
      <div class="slider-area">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <div>
            <div class="active-year-display" id="scrubberYear">2019년</div>
            <div style="color:var(--text-muted); font-size:14px; font-weight:600;" id="scrubberAge">김은찬 기준 24세</div>
          </div>
          <div id="scrubberOverlapsBadge" style="font-size:13px; color:#f59e0b; font-weight:700;"></div>
        </div>
        <input type="range" min="1995" max="2030" value="2019" class="year-slider" id="yearSlider" oninput="updateScrubber(this.value)">
      </div>
      <div class="person-snapshots" id="scrubberSnapshots"></div>
    </div>

    <footer>
      생애 연도별 학업 및 연애 이력 대시보드 (1995~2030)
    </footer>
  </div>

    function computeSpans(arr) {
      const n = arr.length;
      const spans = new Array(n).fill(1);
      const skip = new Array(n).fill(false);
      let i = 0;
      while (i < n) {
        const val = arr[i];
        if (!val) { i++; continue; }
        let j = i + 1;
        while (j < n && arr[j] === val) {
          j++;
        }
        spans[i] = j - i;
        for (let k = i + 1; k < j; k++) {
          skip[k] = true;
        }
        i = j;
      }
      return { spans, skip };
    }

      if (val.includes('건축사사무소') || val.includes('D-NORM') || val.includes('DB증권') || val.includes('RoA')) return `<div class="badge-job">${val}</div>`;
      if (val.includes('최연웅') || val.includes('김재경') || val.includes('김유빈') || val.includes('양주식') || val.includes('슈바이처') || val.includes('이성용') || val.includes('맹민정') || val.includes('김미희') || val.includes('남성택')) {
        return `<div class="badge-studio"><b>${val}</b></div>`;
      }
      return `<div>${val}</div>`;
    }

    function renderVerticalTable() {
      const table = document.getElementById('vTable');

      const yearsArr = timelineData.years.map(t => t.y);
      const agesArr = timelineData.years.map(t => t.age);

      const yearSpanObj = computeSpans(yearsArr);
      const ageSpanObj = computeSpans(agesArr);

      const colDefs = [
        { key: 'sihwan_acad', arr: timelineData.sihwan.academic, isLove: false, cls: 'v-cell-academic' },
        { key: 'sihwan_love', arr: timelineData.sihwan.love, isLove: true, cls: 'v-cell-love' },
        { key: 'jangwoo_acad', arr: timelineData.jangwoo.academic, isLove: false, cls: 'v-cell-academic' },
        { key: 'jangwoo_love', arr: timelineData.jangwoo.love, isLove: true, cls: 'v-cell-love' },
        { key: 'eunchan_acad', arr: timelineData.eunchan.academic, isLove: false, cls: 'v-cell-academic' },
        { key: 'eunchan_love', arr: timelineData.eunchan.love, isLove: true, cls: 'v-cell-love' },
        { key: 'dongwook_acad', arr: timelineData.dongwook.academic, isLove: false, cls: 'v-cell-academic' },
        { key: 'dongwook_love', arr: timelineData.dongwook.love, isLove: true, cls: 'v-cell-love' },
        { key: 'beomseok_acad', arr: timelineData.beomseok.academic, isLove: false, cls: 'v-cell-academic' },
        { key: 'beomseok_love', arr: timelineData.beomseok.love, isLove: true, cls: 'v-cell-love' },
        { key: 'notes', arr: timelineData.notes, isLove: false, cls: 'v-cell-notes' }
      ];

      const spansData = colDefs.map(c => computeSpans(c.arr));

      let html = `
        <thead>
          <tr>
            <th class="v-corner-1" rowspan="2">연도</th>
            <th class="v-corner-2" rowspan="2">나이</th>
            <th class="v-corner-3" rowspan="2">학기</th>
            <th colspan="2" style="border-right: 1px solid rgba(255,255,255,0.15); color:#38bdf8;">김시환</th>
            <th colspan="2" style="border-right: 1px solid rgba(255,255,255,0.15); color:#4ade80;">배장우</th>
            <th colspan="2" style="border-right: 1px solid rgba(255,255,255,0.15); color:#f43f5e;">김은찬</th>
            <th colspan="2" style="border-right: 1px solid rgba(255,255,255,0.15); color:#fb923c;">김동욱</th>
            <th colspan="2" style="border-right: 1px solid rgba(255,255,255,0.15); color:#a78bfa;">박범석</th>
            <th rowspan="2" style="color:#f59e0b;">겹침 및 특징 비고</th>
          </tr>
          <tr>
            <th>학업 / 설계 / 취업</th>
            <th style="border-right: 1px solid rgba(255,255,255,0.15); color:#fb7185;">연애</th>
            <th>학업 / 설계 / 취업</th>
            <th style="border-right: 1px solid rgba(255,255,255,0.15); color:#fb7185;">연애</th>
            <th>학업 / 설계 / 취업</th>
            <th style="border-right: 1px solid rgba(255,255,255,0.15); color:#fb7185;">연애</th>
            <th>학업 / 설계 / 취업</th>
            <th style="border-right: 1px solid rgba(255,255,255,0.15); color:#fb7185;">연애</th>
            <th>학업 / 설계 / 취업</th>
            <th style="border-right: 1px solid rgba(255,255,255,0.15); color:#fb7185;">연애</th>
          </tr>
        </thead>
        <tbody>
      `;

      for (let r = 0; r < timelineData.years.length; r++) {
        html += '<tr>';

        if (!yearSpanObj.skip[r]) {
          const ySpan = yearSpanObj.spans[r];
          html += `<td class="v-col-year" rowspan="${ySpan}">${timelineData.years[r].y}</td>`;
        }

        if (!ageSpanObj.skip[r]) {
          const aSpan = ageSpanObj.spans[r];
          html += `<td class="v-col-age" rowspan="${aSpan}">${timelineData.years[r].age}</td>`;
        }

        html += `<td class="v-col-sem">${timelineData.years[r].sem}</td>`;

        for (let c = 0; c < colDefs.length; c++) {
          const def = colDefs[c];
          const spanInfo = spansData[c];

          if (spanInfo.skip[r]) {
            continue;
          }

          const span = spanInfo.spans[r];
          const val = def.arr[r];
          const badgeHtml = getBadge(val, def.isLove);
          const rowspanAttr = span > 1 ? ` rowspan="${span}"` : '';

          if (def.key === 'notes') {
            html += `<td class="${def.cls}"${rowspanAttr}>${val ? `★ ${val}` : ''}</td>`;
          } else {
            html += `<td class="${def.cls}"${rowspanAttr}><div class="merged-box">${badgeHtml}</div></td>`;
          }
        }

        html += '</tr>';
      }

      html += '</tbody>';
      table.innerHTML = html;
    }

    function renderOverlaps() {
      const container = document.getElementById('viewOverlaps');
      let html = '';
      for (const m of milestones) {
        html += `
          <div class="overlap-card">
            <div class="card-header">
              <span class="card-year">${m.year}</span>
              <span class="card-tag">${m.tag}</span>
            </div>
            <div class="card-title">${m.title}</div>
            <div class="card-desc">${m.desc}</div>
            <div class="card-members">
              ${m.members.map(mem => `<span class="member-pill highlight">${mem}</span>`).join('')}
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function updateScrubber(yearVal) {
      const year = parseInt(yearVal);
      document.getElementById('scrubberYear').innerText = `${year}년`;
      document.getElementById('scrubberAge').innerText = `김은찬 기준 ${year >= 1996 ? year - 1996 + 1 : 0}세 / 박범석 기준 ${year - 1995 + 1}세`;

      const matchingIndices = [];
      timelineData.years.forEach((t, idx) => {
        if (t.y === year) matchingIndices.push(idx);
      });

      let notesFound = [];
      matchingIndices.forEach(idx => {
        if (timelineData.notes[idx]) notesFound.push(timelineData.notes[idx]);
      });
      document.getElementById('scrubberOverlapsBadge').innerText = notesFound.join(' / ');

      const persons = [
        { name: '김시환', data: timelineData.sihwan, color: '#38bdf8' },
        { name: '배장우', data: timelineData.jangwoo, color: '#4ade80' },
        { name: '김은찬', data: timelineData.eunchan, color: '#f43f5e' },
        { name: '김동욱', data: timelineData.dongwook, color: '#fb923c' },
        { name: '박범석', data: timelineData.beomseok, color: '#a78bfa' }
      ];

      const snapContainer = document.getElementById('scrubberSnapshots');
      let html = '';
      for (const p of persons) {
        const statuses = matchingIndices.map(idx => {
          const sem = timelineData.years[idx].sem;
          const status = p.data.academic[idx] || '-';
          return (sem !== '-') ? `<b>[${sem}]</b> ${status}` : status;
        }).join('<br>');

        const loveEntries = matchingIndices.map(idx => p.data.love[idx]).filter(Boolean);
        const loveText = loveEntries.length ? `🌸 연애: ${Array.from(new Set(loveEntries)).join(', ')}` : '';

        html += `
          <div class="snapshot-card" style="border-top: 3px solid ${p.color};">
            <div class="snapshot-name"><span>${p.name}</span></div>
            <div class="snapshot-status">${statuses}</div>
            ${loveText ? `<div class="snapshot-love">${loveText}</div>` : ''}
          </div>
        `;
      }
      snapContainer.innerHTML = html;
    }

    function switchView(viewName) {
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('viewVertical').style.display = 'none';
      document.getElementById('viewOverlaps').style.display = 'none';
      document.getElementById('viewScrubber').style.display = 'none';

      if (viewName === 'vertical') {
        document.getElementById('viewVertical').style.display = 'block';
        document.querySelectorAll('.view-btn')[0].classList.add('active');
      } else if (viewName === 'overlaps') {
        document.getElementById('viewOverlaps').style.display = 'grid';
        document.querySelectorAll('.view-btn')[1].classList.add('active');
      } else if (viewName === 'scrubber') {
        document.getElementById('viewScrubber').style.display = 'block';
        document.querySelectorAll('.view-btn')[2].classList.add('active');
        updateScrubber(document.getElementById('yearSlider').value);
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      const cells = document.querySelectorAll('.v-table td div');
      cells.forEach(c => {
        if (!q) {
          c.style.boxShadow = '';
          c.style.transform = '';
          return;
        }
        if (c.innerText.toLowerCase().includes(q)) {
          c.style.boxShadow = '0 0 12px 3px #6366f1';
          c.style.transform = 'scale(1.05)';
        } else {
          c.style.boxShadow = '';
          c.style.transform = '';
        }
      });
    });

    renderVerticalTable();
    renderOverlaps();
    updateScrubber(2019);
  </script>
</body>
</html>
